# Self-hosted game + multiplayer signaling server:
#   docker compose up -d   ->   http://localhost:8080
services:
  game:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/mp-config.js:/usr/share/nginx/html/multiplayer/mp-config.js:ro
    depends_on:
      - signaling
    restart: unless-stopped

  signaling:
    build: ./server
    environment:
      PROXIED: "true"
    restart: unless-stopped
