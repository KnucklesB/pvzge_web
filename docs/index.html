  <!--
    Game boot. version.json names the build and lists the files that changed
    in it while keeping their path. A browser that still holds the previous
    build in its cache downloads those again before the game starts, instead
    of mixing two versions (which leaves a black screen). The engine entry
    (via the import map), tmpPatch.js and game-audio.js carry the build in
    their URL. If the engine still fails to load, the core files are
    refreshed once and the page reloads.
  -->
  <script>
    (function () {
      var KEY = 'pvzge.build';
      var CORE = [
        'cocos-js/cc.js', 'src/settings.json', 'src/import-map.json', 'index.js', 'tmpPatch.js', 'game-audio.js',
        'assets/internal/config.json', 'assets/internal/index.js', 'assets/main/config.json', 'assets/main/index.js',
        'assets/resources/config.json', 'assets/resources/index.js'
      ];
      function getItem(store, key) { try { return window[store].getItem(key); } catch (e) { return null; } }
      function setItem(store, key, value) { try { window[store].setItem(key, value); } catch (e) {} }
      function refresh(list) {
        return Promise.all(list.map(function (path) {
          return fetch(path, { cache: 'reload' })
            .then(function (res) { return res.ok ? res.arrayBuffer() : null; })
            .catch(function () { return null; });
        }));
      }
      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.body.appendChild(s);
        });
      }
      function boot(build) {
        var v = '?v=' + encodeURIComponent(build);
        var map = document.createElement('script');
        map.type = 'systemjs-importmap';
        map.textContent = JSON.stringify({ imports: { cc: './cocos-js/cc.js' + v } });
        document.body.appendChild(map);
        // SystemJS reads import maps once; make it pick this one up.
        if (System.prepareImport) System.prepareImport(true);
        return loadScript('tmpPatch.js' + v)
          .then(function () { return import('./game-audio.js' + v); })
          .then(function (audio) { return audio.initializeGameAudio(); })
          .then(function () { return System.import('./index.js'); });
      }
      fetch('version.json', { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : {}; })
        .catch(function () { return {}; })
        .then(function (info) {
          var build = info.build || 'dev';
          var files = CORE.concat(info.refresh || []);
          var ready = getItem('localStorage', KEY) === build ? Promise.resolve() : refresh(files).then(function () {
            setItem('localStorage', KEY, build);
          });
          return ready.then(function () { return boot(build); }).catch(function (err) {
            console.error(err);
            if (getItem('sessionStorage', 'pvzge.retry') === build) return;
            setItem('sessionStorage', 'pvzge.retry', build);
            return refresh(files).then(function () { location.reload(); });
          });
        });
    })();
  </script>
