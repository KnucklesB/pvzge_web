# Serves the game and proxies the multiplayer server (signaling + API) on the
# same origin, so no extra port, CORS setup or certificate is needed.
#
# The multiplayer container is looked up at request time through Docker's DNS
# (127.0.0.11), so nginx starts even before that container exists. It is
# reached as "multiplayer" (current docker-compose.yml) or, as a fallback,
# "signaling" (the service name used by the first version of the compose file).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 16m;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 3s;

    location ~ ^/(peerjs|api)(/|$) {
        set $mp_backend http://multiplayer:9000;
        proxy_pass $mp_backend;
        error_page 502 = @mp_legacy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location @mp_legacy {
        set $mp_legacy_backend http://signaling:9000;
        proxy_pass $mp_legacy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Always revalidate the page and the multiplayer files, so players get
    # updates (and the right mp-config.js) without clearing their cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /multiplayer/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
